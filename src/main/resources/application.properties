spring.application.name=demo-spring-boot
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/demodb}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:ThisIsMyDemoSpringBoot8080SecureSecretKey86400000}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Media upload configuration
app.media.upload-dir=${MEDIA_UPLOAD_DIR:uploads}
app.media.public-path=/media
app.media.max-image-size-bytes=10485760
app.media.max-video-size-bytes=104857600
